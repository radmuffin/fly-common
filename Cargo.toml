[package]
name = "fly_common"
version = "0.1.0"
edition = "2021"
description = "Reusable core engine for Fly.io Axum + SQLite web applications"
license = "MIT OR Apache-2.0"

[features]
default = ["db", "auth", "security", "server", "qr"]
db = []
auth = []
security = []
server = []
qr = []
scraper = ["dep:scraper"]
ws = ["axum/ws", "dep:futures-util"]
sync = ["dep:uuid"]
io = ["dep:csv"]
telemetry = []
metrics = []
rate-limit = []
full = ["default", "scraper", "ws", "sync", "io", "telemetry", "metrics", "rate-limit", "sse"]
sse = ["axum/http1", "dep:tokio-stream", "dep:futures-util"]

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1.0", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"

# Optional feature dependencies
scraper = { version = "0.22", optional = true }
futures-util = { version = "0.3", optional = true }
uuid = { version = "1.0", features = ["v4"], optional = true }
csv = { version = "1.3", optional = true }
tokio-stream = { version = "0.1", features = ["sync"], optional = true }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
